<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>チラシ依頼・状況確認</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(40px, env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 700;
    }

    .description {
      margin: 0;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      padding: 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .user-box {
      margin-bottom: 20px;
      padding: 13px 14px;
      background: #f0faf4;
      border-radius: 10px;
      font-size: 14px;
    }

    .method-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
    }

    .method-badge.pickup {
      background: #fff7ed;
      color: #9a3412;
    }

    .field {
      margin-top: 18px;
    }

    .field:first-of-type {
      margin-top: 0;
    }

    .schedule-field {
      padding: 14px;
      border: 2px solid #bbf7d0;
      border-radius: 13px;
      background: #f0fdf4;
    }

    .schedule-field + .schedule-field {
      margin-top: 12px;
    }

    .schedule-field label {
      margin-bottom: 9px;
      font-size: 17px;
    }

    .schedule-field input,
    .schedule-field select {
      min-height: 62px;
      border-width: 2px;
      font-size: 20px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      margin-left: 5px;
      color: #d93025;
      font-size: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 50px;
      padding: 11px 12px;
      border: 1px solid #d0d4d9;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font-size: 16px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #06c755;
      outline: 2px solid rgba(6, 199, 85, 0.14);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .note {
      margin: 6px 0 0;
      color: #777;
      font-size: 12px;
    }

    .primary-button {
      width: 100%;
      min-height: 54px;
      margin-top: 24px;
      border: 0;
      border-radius: 11px;
      background: #06c755;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:disabled {
      background: #9ca3a7;
      cursor: default;
    }

    .secondary-button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      border: 1px solid #cfd4d8;
      border-radius: 11px;
      background: #fff;
      color: #333;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .error {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 9px;
      background: #fff0f0;
      color: #b3261e;
      font-size: 14px;
      line-height: 1.6;
    }

    .loading {
      padding: 70px 20px;
      text-align: center;
      color: #666;
      line-height: 1.8;
    }

    .success {
      padding: 10px 0;
      text-align: center;
    }

    .success-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #06c755;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
    }

    .success h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .success-detail {
      margin: 18px 0;
      padding: 18px;
      border: 2px solid #bbf7d0;
      border-radius: 12px;
      background: #f0fdf4;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.7;
      white-space: pre-line;
    }

    .request-id {
      margin-top: 14px;
      color: #777;
      font-size: 12px;
    }

    .active-section {
      margin-bottom: 20px;
    }

    .active-section h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .active-request-list {
      display: grid;
      gap: 10px;
    }

    .request-group-heading {
      margin: 14px 0 8px;
      font-size: 15px;
      font-weight: 800;
    }

    .request-refresh-button {
      width: 100%;
      margin: 8px 0 12px;
    }

    .request-status-info {
      margin: 8px 0 12px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      line-height: 1.6;
    }

    .past-requests-block {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 2px solid #e5e7eb;
    }

    #requestCountText {
      margin-left: 4px;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .active-request-item {
      padding: 14px;
      border: 1px solid #d8dde2;
      border-radius: 12px;
      background: #fff;
    }

    .active-request-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .active-request-detail {
      white-space: pre-line;
      color: #444;
      font-size: 14px;
      line-height: 1.7;
    }


    .request-status-message {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f8fafc;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .staff-memo-box {
      margin-top: 10px;
      padding: 12px;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      background: #fffbeb;
      color: #78350f;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .staff-memo-title {
      display: block;
      margin-bottom: 4px;
      font-weight: 800;
    }

    .request-meta {
      margin-top: 9px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .active-section-description {
      margin: -3px 0 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    .danger-button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 1px solid #dc2626;
      border-radius: 10px;
      background: #fff;
      color: #b91c1c;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .danger-button:disabled {
      border-color: #d1d5db;
      color: #9ca3af;
      cursor: default;
    }

    .notice {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 9px;
      background: #ecfdf5;
      color: #166534;
      font-size: 14px;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <section id="loadingView" class="loading">
      LINEと接続しています…
    </section>


    <section id="formView" hidden>

      <header class="header">
        <h1 id="appTitle" class="title">
          チラシ配達依頼
        </h1>

        <p id="appDescription" class="description">
          配達を希望する日付・時間帯・枚数を入力してください。
          職員が確認後、LINEで配達可否をお知らせします。
        </p>
      </header>


      <div class="card">

        <div class="user-box">
          利用者：
          <strong id="displayName">確認中</strong>
          <br>
          <span
            id="receiveMethodBadge"
            class="method-badge"
          >
            職員による配達
          </span>
        </div>


        <div
          id="errorMessage"
          class="error"
          role="alert"
          hidden
        ></div>

        <div
          id="noticeMessage"
          class="notice"
          role="status"
          hidden
        ></div>

        <section
          id="activeRequestsSection"
          class="active-section"
        >
          <h2>
            依頼状況
            <span id="requestCountText"></span>
          </h2>
          <p class="active-section-description">
            申込日時・現在の状態・職員からの連絡を確認できます。
            過去の申込も含めてすべて表示します。
          </p>

          <button
            type="button"
            id="refreshRequestsButton"
            class="secondary-button request-refresh-button"
          >
            依頼状況を更新
          </button>

          <div
            id="requestStatusMessage"
            class="request-status-info"
          >
            依頼状況を読み込んでいます…
          </div>

          <div id="currentRequestsBlock">
            <div class="request-group-heading">
              対応中の依頼
              <span id="currentRequestCount"></span>
            </div>
            <div
              id="currentRequestsList"
              class="active-request-list"
            ></div>
          </div>

          <div
            id="pastRequestsBlock"
            class="past-requests-block"
          >
            <div class="request-group-heading">
              過去の依頼
              <span id="pastRequestCount"></span>
            </div>
            <div
              id="pastRequestsList"
              class="active-request-list"
            ></div>
          </div>
        </section>


        <form
          id="requestForm"
          method="post"
          target="gasResponseFrame"
          novalidate
        >

          <input
            type="hidden"
            name="requestType"
            value="request"
          >

          <input
            type="hidden"
            id="idToken"
            name="idToken"
          >


          <div class="field schedule-field">
            <label for="deliveryDate">
              <span id="dateLabelText">配達希望日</span>
              <span class="required">必須</span>
            </label>

            <input
              type="date"
              id="deliveryDate"
              name="deliveryDate"
              required
            >
          </div>


          <div class="field schedule-field">
            <label for="timeSlot">
              <span id="timeLabelText">希望時間帯</span>
              <span class="required">必須</span>
            </label>

            <select
              id="timeSlot"
              name="timeSlot"
              required
            >
              <option value="">選択してください</option>
              <option value="午前">午前</option>
              <option value="13:00～15:00">
                13:00～15:00
              </option>
              <option value="15:00～17:00">
                15:00～17:00
              </option>
            </select>
          </div>


          <div class="field">
            <label for="copies">
              希望枚数
              <span class="required">必須</span>
            </label>

            <select
              id="copies"
              name="copies"
              required
            >
              <option value="">選択してください</option>
              <option value="500">500枚</option>
              <option value="1000">1,000枚</option>
              <option value="1500">1,500枚</option>
              <option value="2000">2,000枚</option>
              <option value="2500">2,500枚</option>
              <option value="3000">3,000枚</option>
            </select>
          </div>


          <div class="field">
            <label for="note">
              備考
            </label>

            <textarea
              id="note"
              name="note"
              maxlength="500"
              placeholder="連絡事項などがあれば入力してください"
            ></textarea>

            <p class="note">
              500文字以内
            </p>
          </div>


          <button
            type="submit"
            id="submitButton"
            class="primary-button"
          >
            配達を依頼する
          </button>

        </form>


        <form
          id="profileForm"
          method="post"
          target="gasResponseFrame"
          hidden
        >
          <input
            type="hidden"
            name="requestType"
            value="profile"
          >

          <input
            type="hidden"
            id="profileIdToken"
            name="idToken"
          >
        </form>

        <form
          id="cancelForm"
          method="post"
          target="gasResponseFrame"
          hidden
        >
          <input
            type="hidden"
            name="requestType"
            value="cancel"
          >

          <input
            type="hidden"
            id="cancelIdToken"
            name="idToken"
          >

          <input
            type="hidden"
            id="cancelRequestId"
            name="requestId"
          >
        </form>

      </div>

    </section>


    <section id="successView" hidden>

      <div class="card success">

        <div class="success-mark">✓</div>

        <h2 id="successTitle">
          配達依頼を受け付けました
        </h2>

        <p id="successMessage">
          職員が内容を確認後、LINEでお知らせします。
        </p>

        <div
          id="successDetail"
          class="success-detail"
        ></div>

        <div
          id="requestId"
          class="request-id"
        ></div>

        <button
          type="button"
          id="successCancelButton"
          class="danger-button"
          onclick="cancelLatestRequest()"
        >
          この申込をキャンセルする
        </button>

        <button
          type="button"
          class="secondary-button"
          onclick="requestAgain()"
        >
          続けて申し込む
        </button>

        <button
          type="button"
          class="primary-button"
          onclick="closeApp()"
        >
          閉じる
        </button>

      </div>

    </section>

  </main>


  <iframe
    id="gasResponseFrame"
    name="gasResponseFrame"
    title="送信結果"
    hidden
  ></iframe>


  <script>
    /*
     * LINE Developersの公開用LIFF ID
     */
    const LIFF_ID =
      '2010872621-pg8RZu11';

    /*
     * GASの /exec で終わるWebアプリURL
     */
    const GAS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbwpyjQjcz-RPI-65jIxKNkiz1Gdp-Q5PwdrSx5RuH1x7F2W4gRPcprv8yHd6GElp9Ikeg/exec';


    const RECEIVE_METHOD_DELIVERY = '配達';
    const RECEIVE_METHOD_PICKUP = '来所受取';

    const loadingView =
      document.getElementById('loadingView');

    const formView =
      document.getElementById('formView');

    const successView =
      document.getElementById('successView');

    const form =
      document.getElementById('requestForm');

    const profileForm =
      document.getElementById('profileForm');

    const cancelForm =
      document.getElementById('cancelForm');

    const submitButton =
      document.getElementById('submitButton');

    const errorMessage =
      document.getElementById('errorMessage');


    let responseTimer = null;
    let profileTimer = null;
    let cancelTimer = null;
    let lastRequest = null;
    let latestRequestId = '';
    let activeRequests = [];
    let currentReceiveMethod =
      RECEIVE_METHOD_DELIVERY;


    function formatLocalDate(date) {
      const year = date.getFullYear();

      const month =
        String(date.getMonth() + 1)
          .padStart(2, '0');

      const day =
        String(date.getDate())
          .padStart(2, '0');

      return `${year}-${month}-${day}`;
    }


    function setupDateInput() {
      const today = new Date();

      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);

      const maximumDate = new Date(today);
      maximumDate.setDate(today.getDate() + 30);

      const input =
        document.getElementById('deliveryDate');

      input.min = formatLocalDate(today);
      input.max = formatLocalDate(maximumDate);
      input.value = formatLocalDate(tomorrow);
    }


    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.hidden = false;
    }


    function hideError() {
      errorMessage.textContent = '';
      errorMessage.hidden = true;
    }


    function setSending(isSending) {
      submitButton.disabled = isSending;

      if (isSending) {
        submitButton.textContent =
          '送信しています…';

        return;
      }

      submitButton.textContent =
        currentReceiveMethod ===
          RECEIVE_METHOD_PICKUP
          ? '受け取りを申し込む'
          : '配達を依頼する';
    }


    function showNotice(message) {
      const notice =
        document.getElementById(
          'noticeMessage'
        );

      notice.textContent = message;
      notice.hidden = false;
    }


    function hideNotice() {
      const notice =
        document.getElementById(
          'noticeMessage'
        );

      notice.textContent = '';
      notice.hidden = true;
    }


    function renderActiveRequests() {
      const section =
        document.getElementById(
          'activeRequestsSection'
        );

      const currentBlock =
        document.getElementById(
          'currentRequestsBlock'
        );

      const pastBlock =
        document.getElementById(
          'pastRequestsBlock'
        );

      const currentList =
        document.getElementById(
          'currentRequestsList'
        );

      const pastList =
        document.getElementById(
          'pastRequestsList'
        );

      const countText =
        document.getElementById(
          'requestCountText'
        );

      const currentCount =
        document.getElementById(
          'currentRequestCount'
        );

      const pastCount =
        document.getElementById(
          'pastRequestCount'
        );

      const statusMessage =
        document.getElementById(
          'requestStatusMessage'
        );

      currentList.innerHTML = '';
      pastList.innerHTML = '';

      const currentStatuses = [
        '確認待ち',
        '配達確定',
        '日時変更'
      ];

      const currentRequests =
        activeRequests.filter(
          function (request) {
            return currentStatuses.includes(
              String(request.status || '')
            );
          }
        );

      const pastRequests =
        activeRequests.filter(
          function (request) {
            return !currentStatuses.includes(
              String(request.status || '')
            );
          }
        );

      function createRequestItem(request) {
        const item =
          document.createElement('div');

        item.className =
          'active-request-item';

        const title =
          document.createElement('div');

        title.className =
          'active-request-title';

        const isPickup =
          request.receiveMethod ===
          RECEIVE_METHOD_PICKUP;

        title.textContent =
          isPickup
            ? '来所受取'
            : '配達';

        const status =
          document.createElement('span');

        status.className =
          'status-badge';

        status.textContent =
          request.statusLabel ||
          request.status ||
          '職員確認待ち';

        title.appendChild(status);

        const detail =
          document.createElement('div');

        detail.className =
          'active-request-detail';

        detail.textContent =
          '申込日時：' +
          String(
            request.requestedAtText ||
            '不明'
          ) +
          '\n' +
          (isPickup
            ? '受取希望日：'
            : '配達希望日：') +
          String(
            request.deliveryDateText ||
            request.deliveryDate ||
            ''
          ) +
          '\n時間帯：' +
          String(request.timeSlot || '') +
          '\n枚数：' +
          Number(request.copies || 0)
            .toLocaleString() +
          '枚';

        if (request.note) {
          detail.textContent +=
            '\n申込時の備考：' +
            String(request.note);
        }

        item.appendChild(title);
        item.appendChild(detail);

        if (request.statusMessage) {
          const message =
            document.createElement('div');

          message.className =
            'request-status-message';

          message.textContent =
            request.statusMessage;

          item.appendChild(message);
        }

        if (request.staffMemo) {
          const memo =
            document.createElement('div');

          memo.className =
            'staff-memo-box';

          const memoTitle =
            document.createElement('span');

          memoTitle.className =
            'staff-memo-title';

          memoTitle.textContent =
            '職員からのお知らせ';

          const memoText =
            document.createElement('div');

          memoText.textContent =
            request.staffMemo;

          memo.appendChild(memoTitle);
          memo.appendChild(memoText);
          item.appendChild(memo);
        }

        const meta =
          document.createElement('div');

        meta.className =
          'request-meta';

        let metaText =
          '受付番号：' +
          String(request.requestId || '');

        if (request.updatedAtText) {
          metaText +=
            '\n最終更新：' +
            request.updatedAtText;
        }

        meta.textContent = metaText;
        item.appendChild(meta);

        if (request.canCancel) {
          const cancelButton =
            document.createElement('button');

          cancelButton.type = 'button';
          cancelButton.className =
            'danger-button';
          cancelButton.textContent =
            'この申込をキャンセルする';

          cancelButton.addEventListener(
            'click',
            function () {
              cancelRequest(
                request.requestId
              );
            }
          );

          item.appendChild(cancelButton);
        }

        return item;
      }

      currentRequests.forEach(
        function (request) {
          currentList.appendChild(
            createRequestItem(request)
          );
        }
      );

      pastRequests.forEach(
        function (request) {
          pastList.appendChild(
            createRequestItem(request)
          );
        }
      );

      countText.textContent =
        '全' +
        activeRequests.length +
        '件';

      currentCount.textContent =
        '（' +
        currentRequests.length +
        '件）';

      pastCount.textContent =
        '（' +
        pastRequests.length +
        '件）';

      currentBlock.hidden = false;
      pastBlock.hidden = false;
      section.hidden = false;

      if (!activeRequests.length) {
        statusMessage.hidden = false;
        statusMessage.textContent =
          '現在、このLINEアカウントに紐づく依頼はありません。';

        currentList.innerHTML =
          '<div class="request-status-info">対応中の依頼はありません。</div>';

        pastList.innerHTML =
          '<div class="request-status-info">過去の依頼はありません。</div>';

        return;
      }

      statusMessage.hidden = true;

      if (!currentRequests.length) {
        currentList.innerHTML =
          '<div class="request-status-info">対応中の依頼はありません。</div>';
      }

      if (!pastRequests.length) {
        pastList.innerHTML =
          '<div class="request-status-info">過去の依頼はありません。</div>';
      }
    }



    function setActiveRequests(
      requests,
      responseHasRequestsField = true
    ) {
      activeRequests =
        Array.isArray(requests)
          ? requests
          : [];

      renderActiveRequests();

      if (!responseHasRequestsField) {
        const statusMessage =
          document.getElementById(
            'requestStatusMessage'
          );

        statusMessage.hidden = false;
        statusMessage.textContent =
          '依頼状況を取得できませんでした。' +
          '配達依頼APP側のCode.gsが最新デプロイになっているか確認してください。';
      }
    }


    function cancelRequest(requestId) {
      if (!requestId) {
        showError(
          'キャンセルする申込を取得できませんでした。'
        );
        return;
      }

      const target =
        activeRequests.find(
          function (request) {
            return (
              request.requestId ===
              requestId
            );
          }
        );

      let detailText = '';

      if (target) {
        detailText =
          '\n\n' +
          String(
            target.deliveryDateText ||
            target.deliveryDate ||
            ''
          ) +
          ' ' +
          String(target.timeSlot || '') +
          '／' +
          Number(target.copies || 0)
            .toLocaleString() +
          '枚';
      }

      const confirmed =
        window.confirm(
          'この申込をキャンセルしますか？' +
          detailText
        );

      if (!confirmed) {
        return;
      }

      hideError();
      hideNotice();

      const currentIdToken =
        liff.getIDToken();

      if (!currentIdToken) {
        showError(
          'LINE認証情報を取得できませんでした。' +
          '画面を開き直してください。'
        );
        return;
      }

      document.getElementById(
        'cancelIdToken'
      ).value =
        currentIdToken;

      document.getElementById(
        'cancelRequestId'
      ).value =
        requestId;

      cancelForm.action =
        GAS_WEB_APP_URL;

      document
        .querySelectorAll(
          '.danger-button'
        )
        .forEach(
          function (button) {
            button.disabled = true;
          }
        );

      cancelForm.submit();

      cancelTimer =
        window.setTimeout(
          function () {
            document
              .querySelectorAll(
                '.danger-button'
              )
              .forEach(
                function (button) {
                  button.disabled = false;
                }
              );

            showError(
              'キャンセル結果を確認できませんでした。' +
              '通信状態を確認して、もう一度お試しください。'
            );
          },
          20000
        );
    }


    function cancelLatestRequest() {
      cancelRequest(latestRequestId);
    }


    function applyReceiveMethod() {
      const isPickup =
        currentReceiveMethod ===
        RECEIVE_METHOD_PICKUP;

      document.title =
        isPickup
          ? 'チラシ受取申込'
          : 'チラシ配達依頼';

      document.getElementById(
        'appTitle'
      ).textContent =
        isPickup
          ? 'チラシ受取申込'
          : 'チラシ配達依頼';

      document.getElementById(
        'appDescription'
      ).textContent =
        isPickup
          ? '事業所で受け取る日付・時間帯・枚数を入力してください。職員が確認後、LINEでお知らせします。'
          : '配達を希望する日付・時間帯・枚数を入力してください。職員が確認後、LINEで配達可否をお知らせします。';

      document.getElementById(
        'dateLabelText'
      ).textContent =
        isPickup
          ? '受取希望日'
          : '配達希望日';

      document.getElementById(
        'timeLabelText'
      ).textContent =
        isPickup
          ? '受取希望時間帯'
          : '希望時間帯';

      const badge =
        document.getElementById(
          'receiveMethodBadge'
        );

      badge.textContent =
        isPickup
          ? '自分で事業所へ取りに行く'
          : '職員による配達';

      badge.className =
        'method-badge' +
        (isPickup ? ' pickup' : '');

      document.getElementById(
        'note'
      ).placeholder =
        isPickup
          ? '受け取り時の連絡事項などがあれば入力してください'
          : '配達時の連絡事項などがあれば入力してください';

      document.getElementById(
        'successTitle'
      ).textContent =
        isPickup
          ? '受取申込を受け付けました'
          : '配達依頼を受け付けました';

      document.getElementById(
        'successMessage'
      ).textContent =
        isPickup
          ? '職員が内容を確認後、LINEで受取可否をお知らせします。'
          : '職員が内容を確認後、LINEでお知らせします。';

      setSending(false);
    }


    function refreshRequestStatus() {
      hideError();
      hideNotice();

      const currentIdToken =
        liff.getIDToken();

      if (!currentIdToken) {
        showError(
          'LINE認証情報を取得できませんでした。画面を開き直してください。'
        );
        return;
      }

      document.getElementById(
        'profileIdToken'
      ).value =
        currentIdToken;

      profileForm.action =
        GAS_WEB_APP_URL;

      const statusMessage =
        document.getElementById(
          'requestStatusMessage'
        );

      statusMessage.hidden = false;
      statusMessage.textContent =
        '依頼状況を更新しています…';

      profileForm.submit();

      window.clearTimeout(
        profileTimer
      );

      profileTimer =
        window.setTimeout(
          function () {
            statusMessage.hidden = false;
            statusMessage.textContent =
              '依頼状況を更新できませんでした。通信状態を確認してください。';
          },
          20000
        );
    }


    async function initializeApp() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });

          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            'LINE認証情報を取得できませんでした。'
          );
        }

        const profile = await liff.getProfile();

        document.getElementById(
          'displayName'
        ).textContent =
          profile.displayName;

        document.getElementById(
          'idToken'
        ).value =
          idToken;

        document.getElementById(
          'profileIdToken'
        ).value =
          idToken;

        form.action =
          GAS_WEB_APP_URL;

        profileForm.action =
          GAS_WEB_APP_URL;

        cancelForm.action =
          GAS_WEB_APP_URL;

        document.getElementById(
          'cancelIdToken'
        ).value =
          idToken;

        setupDateInput();

        profileForm.submit();

        profileTimer =
          window.setTimeout(
            function () {
              loadingView.innerHTML =
                '利用者設定を確認できませんでした。<br>' +
                '通信状態を確認して、LINEから開き直してください。';
            },
            20000
          );

      } catch (error) {
        console.error(error);

        loadingView.innerHTML =
          'LINEとの接続に失敗しました。<br>' +
          'LINEアプリから開き直してください。<br><br>' +
          String(error.message || error);
      }
    }


    form.addEventListener(
      'submit',
      function (event) {
        event.preventDefault();
        hideError();

        if (!form.reportValidity()) {
          return;
        }

        const currentIdToken =
          liff.getIDToken();

        if (!currentIdToken) {
          showError(
            'LINE認証情報を取得できませんでした。' +
            '画面を開き直してください。'
          );

          return;
        }

        document.getElementById(
          'idToken'
        ).value =
          currentIdToken;

        lastRequest = {
          deliveryDate:
            document.getElementById(
              'deliveryDate'
            ).value,

          timeSlot:
            document.getElementById(
              'timeSlot'
            ).value,

          copies:
            document.getElementById(
              'copies'
            ).value
        };

        setSending(true);

        form.submit();

        responseTimer =
          window.setTimeout(
            function () {
              setSending(false);

              showError(
                '送信結果を確認できませんでした。' +
                '通信状態を確認して、もう一度お試しください。'
              );
            },
            20000
          );
      }
    );


    window.addEventListener(
      'message',
      function (event) {
        const result = event.data;

        if (
          !result ||
          result.source !==
            'chirashi-delivery-app'
        ) {
          return;
        }

        if (result.mode === 'profile') {
          window.clearTimeout(
            profileTimer
          );

          if (!result.success) {
            loadingView.innerHTML =
              '利用者設定を確認できませんでした。<br><br>' +
              String(
                result.message ||
                '職員へ確認してください。'
              );

            return;
          }

          currentReceiveMethod =
            result.receiveMethod ===
              RECEIVE_METHOD_PICKUP
              ? RECEIVE_METHOD_PICKUP
              : RECEIVE_METHOD_DELIVERY;

          if (result.userName) {
            document.getElementById(
              'displayName'
            ).textContent =
              result.userName;
          }

          applyReceiveMethod();

          setActiveRequests(
            result.activeRequests,
            Object.prototype.hasOwnProperty.call(
              result,
              'activeRequests'
            )
          );

          loadingView.hidden = true;
          formView.hidden = false;

          return;
        }

        if (result.mode === 'cancel') {
          window.clearTimeout(
            cancelTimer
          );

          document
            .querySelectorAll(
              '.danger-button'
            )
            .forEach(
              function (button) {
                button.disabled = false;
              }
            );

          if (!result.success) {
            showError(
              result.message ||
              'キャンセルに失敗しました。'
            );

            return;
          }

          setActiveRequests(
            result.activeRequests
          );

          latestRequestId = '';

          successView.hidden = true;
          formView.hidden = false;

          showNotice(
            result.message ||
            '申込をキャンセルしました。'
          );

          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });

          return;
        }

        if (result.mode !== 'request') {
          return;
        }

        window.clearTimeout(
          responseTimer
        );

        setSending(false);

        if (!result.success) {
          showError(
            result.message ||
            '依頼の送信に失敗しました。'
          );

          return;
        }

        if (result.duplicate) {
          setActiveRequests(
            result.activeRequests
          );

          successView.hidden = true;
          formView.hidden = false;

          showNotice(
            result.message ||
            '同じ内容の申込がすでにあります。'
          );

          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });

          return;
        }

        currentReceiveMethod =
          result.receiveMethod ===
            RECEIVE_METHOD_PICKUP
            ? RECEIVE_METHOD_PICKUP
            : RECEIVE_METHOD_DELIVERY;

        latestRequestId =
          result.requestId || '';

        setActiveRequests(
          result.activeRequests
        );

        applyReceiveMethod();

        const date = new Date(
          lastRequest.deliveryDate +
          'T00:00:00'
        );

        const formattedDate =
          date.toLocaleDateString(
            'ja-JP',
            {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              weekday: 'short'
            }
          );

        document.getElementById(
          'successDetail'
        ).textContent =
          (currentReceiveMethod === RECEIVE_METHOD_PICKUP
            ? '受取日：'
            : '配達日：') +
          formattedDate +
          '\n時間帯：' +
          lastRequest.timeSlot +
          '\n枚数：' +
          Number(lastRequest.copies)
            .toLocaleString() +
          '枚';

        document.getElementById(
          'requestId'
        ).textContent =
          '受付番号：' +
          result.requestId;

        formView.hidden = true;
        successView.hidden = false;

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }
    );


    function requestAgain() {
      successView.hidden = true;
      formView.hidden = false;

      form.reset();

      document.getElementById(
        'idToken'
      ).value =
        liff.getIDToken() || '';

      setupDateInput();
      hideError();
      hideNotice();
      renderActiveRequests();
      applyReceiveMethod();

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }


    function closeApp() {
      if (
        typeof liff !== 'undefined' &&
        liff.isInClient()
      ) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }


    document.getElementById(
      'refreshRequestsButton'
    ).addEventListener(
      'click',
      refreshRequestStatus
    );


    initializeApp();
  </script>

</body>
</html>
